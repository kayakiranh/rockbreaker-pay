name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RockBreaker.Pay.sln

      - name: Build
        run: dotnet build RockBreaker.Pay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RockBreaker.Pay.sln --configuration Release --no-build
